name: ClipNest
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: '13.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 2
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  ClipNest:
    type: application
    platform: macOS
    sources: [ClipNest]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jo9900.ClipNest
        INFOPLIST_FILE: ClipNest/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClipNest/Resources/ClipNest.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      testTargets: [ClipNestTests]
  ClipNestTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ClipNestTests]
    dependencies:
      - target: ClipNest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jo9900.ClipNestTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClipNest.app/Contents/MacOS/ClipNest
        BUNDLE_LOADER: $(TEST_HOST)
